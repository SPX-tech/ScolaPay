services:
  # ============================================================
  # PostgreSQL Database
  # ============================================================
  postgres:
    image: postgres:16.15-alpine
    container_name: scolapay-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-edu_cash}
    # Exposé uniquement sur la loopback de l'hôte (jamais publiquement) et port
    # configurable pour cohabiter avec d'autres PostgreSQL sur la machine.
    # Le backend joint la base via le réseau Docker interne (postgres:5432).
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================================================
  # Backend API (NestJS + Prisma)
  # ============================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: production
    container_name: scolapay-api
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/edu_cash?schema=public}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET:?ACCESS_TOKEN_SECRET is required}
      ACCESS_TOKEN_EXPIRY_SECONDS: ${ACCESS_TOKEN_EXPIRY_SECONDS:-28800}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-disabled}
      # Worker outbox : polling cron actif par défaut (mettre "false" pour désactiver)
      OUTBOX_POLLING_ENABLED: ${OUTBOX_POLLING_ENABLED:-true}
      # SMS Africa's Talking : sans AT_API_KEY, les SMS restent en mode mock
      AT_USERNAME: ${AT_USERNAME:-sandbox}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  migrate:
    build:
      context: ./backend
      target: migration
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/edu_cash?schema=public}
    depends_on:
      postgres:
        condition: service_healthy

  # ============================================================
  # Web Dashboard (Next.js)
  # ============================================================
  web:
    build:
      context: ./web
      dockerfile: Dockerfile
      # NEXT_PUBLIC_API_URL doit être injecté au build (inliné par Next.js),
      # pas seulement au runtime, sinon le bundle client garde le fallback.
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    container_name: scolapay-web
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api/v1}
    depends_on:
      - backend

  # ============================================================
  # Nginx Reverse Proxy
  # ============================================================
  nginx:
    image: nginx:alpine
    container_name: scolapay-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-8080}:8080"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - web

volumes:
  postgres_data:
