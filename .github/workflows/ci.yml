name: CI

on:
  push:
    branches: [main, 'mission001/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.6-alpine
        env:
          POSTGRES_USER: scolapay_smoke
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: scolapay_smoke
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U scolapay_smoke -d scolapay_smoke"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SCOLAPAY_DB_USERNAME: scolapay_smoke
      SCOLAPAY_DB_PASSWORD: isolated_ci_only
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configurer la base jetable
        run: echo 'SCOLAPAY_DB_URL=jdbc:postgresql://localhost:${{ job.services.postgres.ports[5432] }}/scolapay_smoke' >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Compiler et tester sur PostgreSQL réel
        run: ./mvnw --batch-mode --no-transfer-progress verify
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-test-reports
          path: core/target/surefire-reports/
          if-no-files-found: ignore
      - name: Refuser de démarrer sans secret suffisant
        run: |
          if timeout 90 java -jar target/scolapay-core.jar; then
            echo "L'application a démarré sans secret." && exit 1
          fi
          if SCOLAPAY_JWT_SECRET=trop-court timeout 90 java -jar target/scolapay-core.jar; then
            echo "L'application a démarré avec un secret trop court." && exit 1
          fi
      - name: Démarrer le JAR et vérifier sa surface publique
        env:
          SCOLAPAY_JWT_SECRET: secret-de-verification-ci-sans-aucun-acces-reel
          SERVER_PORT: '18081'
        run: |
          java -jar target/scolapay-core.jar > core-smoke.log 2>&1 &
          APP_PID=$!
          curl --fail --silent --show-error --retry 30 --retry-delay 2 --retry-all-errors http://127.0.0.1:18081/actuator/health
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/api/v2/me)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' http://127.0.0.1:18081/actuator/env)" = 401
          test "$(curl --silent --output /dev/null --write-out '%{http_code}' -X POST -H 'Content-Type: application/json' -d '{"identifier":"inconnu@scolapay.test","password":"mot-de-passe-faux"}' http://127.0.0.1:18081/api/v2/auth/login)" = 401
          kill "$APP_PID"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: core-smoke-log
          path: core/core-smoke.log
          if-no-files-found: ignore

  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: scolapay_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: scolapay_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U scolapay_test -d scolapay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACCESS_TOKEN_SECRET: isolated-ci-signing-key-with-no-production-access
      OUTBOX_POLLING_ENABLED: 'false'
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configurer la base jetable
        run: echo 'DATABASE_URL=postgresql://scolapay_test:isolated_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/scolapay_test?schema=public' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --strict-peer-deps
        id: dependencies
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - name: Vérifier le rejeu des migrations
        run: npm run prisma:migrate:deploy
      - name: Vérifier l'absence de dérive du schéma
        run: npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Vérifier le jeu de démonstration sur la base jetable
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node dist/prisma/seed.js
      - run: npm test -- --runInBand
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run test:e2e -- --runInBand
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api/v1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --strict-peer-deps
        id: dependencies
      - run: npm run lint
      - run: npm run build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Assembler le rendu autonome
        id: standalone
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Installer Chromium pour les tests navigateur
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        with:
          name: web-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
      - name: Archiver le rendu pour vérification
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        run: tar -czf web-preview.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v7
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        with:
          name: web-preview
          path: web/web-preview.tar.gz
