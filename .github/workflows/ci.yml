name: CI

on:
  push:
    branches: [main, 'mission001/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16.15-alpine
        env:
          POSTGRES_USER: scolapay_test
          POSTGRES_PASSWORD: isolated_ci_only
          POSTGRES_DB: scolapay_test
        ports: ['5432/tcp']
        options: >-
          --health-cmd "pg_isready -U scolapay_test -d scolapay_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      ACCESS_TOKEN_SECRET: isolated-ci-signing-key-with-no-production-access
      OUTBOX_POLLING_ENABLED: 'false'
      PAYMENT_PROVIDER: mock
      NODE_ENV: test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Configurer la base jetable
        run: echo 'DATABASE_URL=postgresql://scolapay_test:isolated_ci_only@localhost:${{ job.services.postgres.ports[5432] }}/scolapay_test?schema=public' >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --strict-peer-deps
        id: dependencies
      - run: npm run prisma:generate
      - run: npm run prisma:migrate:deploy
      - name: Vérifier le rejeu des migrations
        run: npm run prisma:migrate:deploy
      - name: Vérifier l'absence de dérive du schéma
        run: npx --no-install prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run lint
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Vérifier le jeu de démonstration sur la base jetable
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: node dist/prisma/seed.js
      - run: npm test -- --runInBand
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run test:e2e -- --runInBand
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_API_URL: /api/v1
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm install --global npm@11.19.1
      - run: npm ci --strict-peer-deps
        id: dependencies
      - run: npm run lint
      - run: npm run build
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm run typecheck
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm test
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - run: npm audit --omit=dev --audit-level=high
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
      - name: Assembler le rendu autonome
        id: standalone
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        run: |
          cp -r .next/static .next/standalone/.next/static
          cp -r public .next/standalone/public
      - name: Installer Chromium pour les tests navigateur
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        run: npx --no-install playwright install --with-deps chromium
      - run: npm run test:e2e
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        with:
          name: web-e2e
          path: |
            web/test-results/
            web/playwright-report/
          if-no-files-found: ignore
      - name: Archiver le rendu pour vérification
        if: ${{ !cancelled() && steps.standalone.outcome == 'success' }}
        run: tar -czf web-preview.tar.gz -C .next/standalone .
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() && steps.dependencies.outcome == 'success' }}
        with:
          name: web-preview
          path: web/web-preview.tar.gz

  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4.0.4
        with:
          packages: platform-tools platforms;android-37.0 build-tools;36.0.0
      - uses: gradle/actions/setup-gradle@v6.4.1
        with:
          gradle-version: '9.6.0'
      - name: Compiler et vérifier Android
        run: bash gradlew --no-daemon --max-workers=2 :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-reports
          path: |
            android/app/build/reports/
            android/app/build/test-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ !cancelled() }}
        with:
          name: android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: ignore

  android-runtime:
    needs: android
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    steps:
      - name: Télécharger l’APK de cette exécution
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name android-debug --dir apk
      - name: Activer KVM sur le runner jetable
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          ram-size: 1536M
          disable-animations: true
          script: |
            adb install apk/app-debug.apk
            adb shell am start -W -n com.scolapay.mobile/.MainActivity
            adb shell uiautomator dump /sdcard/login.xml
            adb pull /sdcard/login.xml login.xml
            grep -q 'Code établissement' login.xml
            adb shell screencap -p /sdcard/login.png
            adb pull /sdcard/login.png login.png
            adb logcat -d -b crash > crash.log
            ! grep -q 'Process: com.scolapay.mobile' crash.log
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: android-runtime
          path: |
            login.xml
            login.png
            crash.log
