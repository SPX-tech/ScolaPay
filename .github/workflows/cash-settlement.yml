name: Single obligation cash settlement
on:
  push:
    branches: ['mission004/lot2-single-settlement']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cash-settlement-${{ github.ref }}
  cancel-in-progress: true
jobs:
  settlement:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier le règlement sur PostgreSQL jetable
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest='SingleObligationSettlementTest,CashSettlementSqlTest,CashAllocationDisabledTest,InstallmentCoverageTest,CashReception*Test,Adjustment*Test,FamilyBillingViewTest,Lot6FinalizationRegressionTest,ModularityTest' test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: settlement-test-reports
          path: core/target/surefire-reports/
          if-no-files-found: error
