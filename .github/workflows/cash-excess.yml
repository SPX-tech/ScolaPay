name: Cash excess reservations
on:
  push:
    branches: ['mission004/lot2-excess-reservations']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: cash-excess-${{ github.ref }}
  cancel-in-progress: true
jobs:
  excess:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier les excédents sur PostgreSQL jetable
        run: ./mvnw --batch-mode --no-transfer-progress '-Dtest=CashExcess*Test,SingleObligationSettlementTest,CashSettlement*Test,CashAllocationDisabledTest,InstallmentCoverageTest,CashReception*Test,Adjustment*Test,FamilyBillingViewTest,Lot6FinalizationRegressionTest,ModularityTest,StaffRoleTest,NotificationRecoveryTest' test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cash-excess-test-reports
          path: |
            core/target/surefire-reports/
            core/target/excess-probe/
          if-no-files-found: error
