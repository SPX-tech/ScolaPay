name: Lot 6 finalization
on:
  push:
    branches: ['finalize/lot6-core']
    paths: ['core/**', '.github/workflows/lot6-finalization.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: lot6-finalization-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regressions:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier les régressions sur HTTP et PostgreSQL réels
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest='Lot6Finalization*Test,PartyCorrection*Test' test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: lot6-finalization-regressions
          path: core/target/surefire-reports/
