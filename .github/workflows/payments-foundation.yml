name: Cash reception foundation

on:
  push:
    branches: ['mission004/lot2-cash-foundation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cash-foundation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cash:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier les déclarations sur PostgreSQL jetable
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest=CashReceptionTest test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: cash-test-reports
          path: core/target/surefire-reports/
          if-no-files-found: error
