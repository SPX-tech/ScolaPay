name: Notifications

on:
  push:
    branches: ['feat/notification-foundation']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notifications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  notifications:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier les notifications et la modularité sur PostgreSQL réel
        run: ./mvnw --batch-mode --no-transfer-progress -Dtest='Notification*Test,ResendEmailTransportTest,PayloadCipherTest,ModularityTest,GoLiveTest' test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: notification-test-reports
          path: core/target/surefire-reports/
