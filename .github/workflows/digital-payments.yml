name: Digital payment preparation
on:
  push:
    branches: ['mission005/digital-intent-foundation']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: digital-payments-${{ github.ref }}
  cancel-in-progress: true
jobs:
  digital:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: core
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.2.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
          cache-dependency-path: core/pom.xml
      - name: Vérifier les intentions sur PostgreSQL jetable
        run: ./mvnw --batch-mode --no-transfer-progress '-Dtest=Digital*Test,Cash*Test,SingleObligationSettlementTest,InstallmentCoverageTest,Adjustment*Test,FamilyBillingViewTest,Lot6FinalizationRegressionTest,ModularityTest,StaffRoleTest,NotificationRecoveryTest' test
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: digital-payment-test-reports
          path: |
            core/target/surefire-reports/
            core/target/digital-probe/
          if-no-files-found: error
