spring:
  application:
    name: scolapay-core
  datasource:
    # Sans valeur par défaut : une configuration manquante doit empêcher le démarrage.
    url: ${SCOLAPAY_DB_URL}
    username: ${SCOLAPAY_DB_USERNAME}
    password: ${SCOLAPAY_DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
      connection-init-sql: "SET statement_timeout = '15s'; SET lock_timeout = '5s'"
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    locations: classpath:db/migration
  modulith:
    events:
      completion-mode: archive
      jdbc:
        schema-initialization:
          enabled: false
      # Sans ces durées, une publication interrompue par un arrêt brutal ne serait jamais reprise.
      staleness:
        published: PT5M
        processing: PT5M
        resubmitted: PT5M
        check-interval: PT1M

server:
  # L'origine est résolue par la politique explicite des API publiques, sans réécriture automatique.
  forward-headers-strategy: none
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

scolapay:
  security:
    jwt-secret: ${SCOLAPAY_JWT_SECRET}
    issuer: scolapay-core
    access-token-ttl: PT30M
  http:
    max-request-body-bytes: 262144
  portal:
    enabled: ${SCOLAPAY_PORTAL_ENABLED:false}
  outbox:
    recovery-interval: PT1M
    batch-size: 1000
    retry-delay: PT1M
    max-retry-delay: PT1H
    overdue-after: PT15M
  notifications:
    encryption-key: ${SCOLAPAY_NOTIFICATIONS_ENCRYPTION_KEY:}
    poll-interval: PT10S
    initial-delay: PT10S
    email:
      provider: ${SCOLAPAY_NOTIFICATIONS_EMAIL_PROVIDER:disabled}
      api-key: ${SCOLAPAY_NOTIFICATIONS_EMAIL_API_KEY:}
      from: ${SCOLAPAY_NOTIFICATIONS_EMAIL_FROM:}
      timeout: PT10S
  billing:
    max-issuance-size: 5000
    max-review-rows: 50000
    # Politique initiale : au-delà du premier de ces seuils, le cumul des écritures actives exige une seconde personne.
    sensitive-adjustment-percent: 25
    sensitive-adjustment-xaf: 100000
  payments:
    digital:
      intents-enabled: ${SCOLAPAY_DIGITAL_PAYMENT_INTENTS_ENABLED:false}
    cash-receptions-enabled: ${SCOLAPAY_CASH_RECEPTIONS_ENABLED:false}
    cash-allocations-enabled: ${SCOLAPAY_CASH_ALLOCATIONS_ENABLED:false}
    cash-excess-reservations-enabled: ${SCOLAPAY_CASH_EXCESS_RESERVATIONS_ENABLED:false}
    cash-identities-enabled: ${SCOLAPAY_CASH_IDENTITIES_ENABLED:false}
    identity-encryption-key: ${SCOLAPAY_CASH_IDENTITY_ENCRYPTION_KEY:}
  bootstrap:
    # Ne crée le premier opérateur que si ces deux valeurs sont fournies.
    operator-contact: ${SCOLAPAY_BOOTSTRAP_OPERATOR_CONTACT:}
    operator-password: ${SCOLAPAY_BOOTSTRAP_OPERATOR_PASSWORD:}
